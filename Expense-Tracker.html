<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monthly expenses</title>
<style>
  :root {
    --bg: #f6f5f2;
    --card: #ffffff;
    --text: #1c1c1c;
    --text-dim: #6b6b6b;
    --border: #e4e2dd;
    --accent: #2c5f4f;
    --green: #2f9e5b;
    --green-bg: #e9f7ee;
    --gray: #9a9790;
    --gray-bg: #f0efec;
    --yellow: #b5860b;
    --yellow-bg: #fdf3dc;
    --red: #c23b3b;
    --red-bg: #fbe9e7;
    --glow1: rgba(44,95,79,0.18);
    --glow2: rgba(181,134,11,0.11);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16181a; --card: #202325; --text: #ececea; --text-dim: #9a9a98;
      --border: #33363a; --accent: #6fbfa2; --green: #4fc17a; --green-bg: #1c3327;
      --gray: #8a8d90; --gray-bg: #26282b; --yellow: #e0b24a; --yellow-bg: #362d16;
      --red: #e2685f; --red-bg: #3a2020;
      --glow1: rgba(111,191,162,0.26); --glow2: rgba(224,178,74,0.16);
    }
  }
  :root[data-theme="dark"] {
    --bg: #16181a; --card: #202325; --text: #ececea; --text-dim: #9a9a98;
    --border: #33363a; --accent: #6fbfa2; --green: #4fc17a; --green-bg: #1c3327;
    --gray: #8a8d90; --gray-bg: #26282b; --yellow: #e0b24a; --yellow-bg: #362d16;
    --red: #e2685f; --red-bg: #3a2020;
    --glow1: rgba(111,191,162,0.26); --glow2: rgba(224,178,74,0.16);
  }
  :root[data-bg="slate"] {
    --bg: #edf1f7 !important;
    --glow1: rgba(28,58,97,0.16) !important;
    --glow2: rgba(84,160,196,0.10) !important;
  }
  @media (prefers-color-scheme: dark) {
    :root[data-bg="slate"]:not([data-theme="light"]) {
      --bg: #0f141c !important;
      --glow1: rgba(74,116,176,0.28) !important;
      --glow2: rgba(90,180,206,0.14) !important;
    }
  }
  :root[data-bg="slate"][data-theme="dark"] {
    --bg: #0f141c !important;
    --glow1: rgba(74,116,176,0.28) !important;
    --glow2: rgba(90,180,206,0.14) !important;
  }
  :root[data-bg="warm"] {
    --bg: #fbf3e7 !important;
    --glow1: rgba(214,124,48,0.20) !important;
    --glow2: rgba(196,96,96,0.10) !important;
  }
  @media (prefers-color-scheme: dark) {
    :root[data-bg="warm"]:not([data-theme="light"]) {
      --bg: #1d150e !important;
      --glow1: rgba(230,152,80,0.26) !important;
      --glow2: rgba(206,110,110,0.13) !important;
    }
  }
  :root[data-bg="warm"][data-theme="dark"] {
    --bg: #1d150e !important;
    --glow1: rgba(230,152,80,0.26) !important;
    --glow2: rgba(206,110,110,0.13) !important;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--text);
    background:
      radial-gradient(circle at 12% -5%, var(--glow1), transparent 48%),
      radial-gradient(circle at 105% 25%, var(--glow2), transparent 45%),
      var(--bg);
    background-attachment: fixed;
    transition: background 0.4s ease;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  header {
    position: sticky; top: 0; padding: env(safe-area-inset-top, 0px) 18px 14px;
    background: var(--bg);
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 5; border-bottom: 1px solid var(--border);
  }
  h1 { font-size: 22px; font-weight: 650; margin: 14px 0 2px; letter-spacing: -0.02em; }
  .header-month { font-size: 12.5px; color: var(--text-dim); margin-bottom: 12px; }
  .bg-toggle {
    width: 34px; height: 34px; border-radius: 50%; background: var(--card);
    border: 1px solid var(--border); font-size: 15px; flex-shrink: 0;
  }
  .summary { display: flex; gap: 10px; margin-bottom: 12px; }
  .summary .box {
    flex: 1; background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 12px;
  }
  .summary .label { font-size: 11.5px; color: var(--text-dim); margin-bottom: 2px; }
  .summary .value { font-size: 17px; font-weight: 650; }
  main { padding: 16px 18px 50px; max-width: 560px; margin: 0 auto; }
  h2.section-title {
    font-size: 13px; text-transform: none; color: var(--text-dim);
    font-weight: 600; margin: 26px 0 10px;
  }
  h2.section-title:first-child { margin-top: 0; }
  h2.section-title.collapsible { display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
  h2.section-title .chevron { font-size: 11px; transition: transform 0.2s ease; }
  h2.section-title.collapsed .chevron { transform: rotate(-90deg); }
  .section-body.collapsed { display: none; }
  .empty { text-align: center; color: var(--text-dim); padding: 40px 20px; font-size: 15px; line-height: 1.5; }
  .bill {
    background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--gray);
    border-radius: 12px; padding: 13px 14px; margin-bottom: 10px;
  }
  .bill.status-overdue, .bill.status-urgent { border-left-color: var(--red); }
  .bill.status-soon { border-left-color: var(--yellow); }
  .bill.status-paid { border-left-color: var(--green); }
  .bill-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .bill-name { font-size: 15.5px; font-weight: 600; }
  .bill-recur { font-size: 12px; color: var(--text-dim); margin-top: 1px; }
  .bill-amount { font-size: 15.5px; font-weight: 600; white-space: nowrap; }
  .bill-status-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  .pill { font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 999px; }
  .status-overdue .pill, .status-urgent .pill { background: var(--red-bg); color: var(--red); }
  .status-soon .pill { background: var(--yellow-bg); color: var(--yellow); }
  .status-paid .pill { background: var(--green-bg); color: var(--green); }
  .status-upcoming .pill { background: var(--gray-bg); color: var(--gray); }
  .bill-actions { display: flex; gap: 8px; }
  .bill-note-display {
    margin-top: 9px; font-size: 12.5px; color: var(--text-dim);
    background: var(--gray-bg); border-radius: 8px; padding: 7px 9px;
  }
  button { font-family: inherit; border: none; cursor: pointer; }
  .btn-paid { background: var(--accent); color: #fff; font-size: 12.5px; font-weight: 600; padding: 6px 12px; border-radius: 8px; }
  .btn-paid:disabled { opacity: 0.5; }
  .btn-del { background: none; color: var(--text-dim); font-size: 12.5px; padding: 6px 4px; }
  #addBtn { margin-bottom: 6px; }

  .cat-card {
    background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--gray);
    border-radius: 12px; padding: 13px 14px; margin-bottom: 10px;
  }
  .cat-card.over-budget { border-left-color: var(--red); }
  .cat-top { display: flex; justify-content: space-between; align-items: center; }
  .cat-name { font-size: 15px; font-weight: 600; }
  .cat-total { font-size: 15px; font-weight: 650; color: var(--accent); }
  .cat-icon-btn { background: none; font-size: 13px; padding: 2px 3px; color: var(--text-dim); }
  .cat-budget-row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .cat-budget-field { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-dim); }
  .cat-budget-field input {
    width: 84px; font-size: 13px; padding: 5px 7px; border-radius: 7px;
    border: 1px solid var(--border); background: var(--gray-bg); color: var(--text); font-family: inherit;
  }
  .budget-pill { font-size: 11.5px; font-weight: 600; padding: 3px 8px; border-radius: 999px; }
  .budget-pill.over { background: var(--red-bg); color: var(--red); }
  .budget-pill.ok { background: var(--green-bg); color: var(--green); }
  .cat-add {
    margin-top: 10px; width: 100%; background: var(--gray-bg); color: var(--text);
    font-size: 13px; font-weight: 600; padding: 8px; border-radius: 8px; text-align: center;
  }
  .cat-add.btn-navy { background: #1e3a5f; color: #ffffff; }
  @media (prefers-color-scheme: dark) {
    .cat-add.btn-navy { background: #2c4d76; }
  }
  .cat-entries { margin-top: 10px; }
  .entry-row {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12.5px; color: var(--text-dim); padding: 5px 0; border-top: 1px solid var(--border);
  }
  .entry-row .e-note { color: var(--text); }
  .entry-row .e-del { color: var(--text-dim); font-size: 12px; padding: 2px 6px; background: none; }
  .month-total {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 2px 2px 12px;
  }
  .month-total .label { font-size: 13px; color: var(--text-dim); }
  .month-total .value { font-size: 20px; font-weight: 700; }
  .backup-row { display: flex; gap: 10px; margin-top: 26px; }
  .backup-row button { flex: 1; }
  .backup-note { font-size: 11.5px; color: var(--text-dim); margin-top: 8px; text-align: center; line-height: 1.5; }

  .fab {
    position: fixed; right: 20px; bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    width: 54px; height: 54px; border-radius: 50%; background: var(--accent); color: #fff;
    font-size: 28px; line-height: 54px; text-align: center; box-shadow: 0 4px 14px rgba(0,0,0,0.25); z-index: 10;
  }
  .sheet-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 20; display: none; }
  .sheet-backdrop.open { display: block; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg);
    border-radius: 18px 18px 0 0; padding: 18px 18px calc(24px + env(safe-area-inset-bottom, 0px));
    z-index: 21; transform: translateY(100%); transition: transform 0.25s ease;
    max-height: 80vh; overflow-y: auto;
    box-shadow: 0 -8px 30px rgba(0,0,0,0.18);
  }
  .sheet.open { transform: translateY(0); }
  .sheet h2 { font-size: 17px; margin: 4px 0 16px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12.5px; color: var(--text-dim); margin-bottom: 5px; }
  .field input, .field select {
    width: 100%; font-size: 16px; padding: 10px 11px; border-radius: 9px;
    border: 1px solid var(--border); background: var(--card); color: var(--text); font-family: inherit;
  }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .sheet-actions { display: flex; gap: 10px; margin-top: 6px; }
  .btn-cancel {
    flex: 1; background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 12px; border-radius: 10px; font-size: 15px; font-weight: 600;
  }
  .btn-save { flex: 1; background: var(--accent); color: #fff; padding: 12px; border-radius: 10px; font-size: 15px; font-weight: 600; }
  .icon-picker { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 2px; }
  .icon-btn {
    font-size: 19px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--card);
  }
  .icon-btn.selected { border-color: var(--accent); background: var(--green-bg); }
  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    transform: translate(-50%, 12px); background: var(--text); color: var(--bg);
    padding: 10px 16px; border-radius: 999px; font-size: 13px; font-weight: 600;
    opacity: 0; pointer-events: none; transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 30; max-width: 85vw; text-align: center;
  }
  .toast.show { opacity: 0.96; transform: translate(-50%, 0); }
</style>
</head>
<body>

<header>
  <div style="display:flex; align-items:center; justify-content:space-between;">
    <div>
      <h1>Monthly expenses</h1>
      <div class="header-month" id="headerMonth"></div>
    </div>
    <button class="bg-toggle" id="bgToggle" title="Change background">🎨</button>
  </div>
</header>

<main id="main">
  <h2 class="section-title collapsible" data-target="billsBody">Recurring bills <span class="chevron">▾</span></h2>
  <div class="section-body" id="billsBody">
    <div class="summary">
      <div class="box">
        <div class="label" id="billsMonthLabel">Bills this month</div>
        <div class="value" id="sumMonthly">₹0</div>
      </div>
    </div>
    <div id="list"></div>
    <button class="cat-add btn-navy" id="addBtn">Add bill</button>
  </div>

  <h2 class="section-title collapsible" data-target="expensesBody">This month's spending <span class="chevron">▾</span></h2>
  <div class="section-body" id="expensesBody">
    <div class="month-total">
      <span class="label">Total logged this month</span>
      <span class="value" id="expMonthTotal">₹0</span>
    </div>
    <div id="catList"></div>
    <button class="cat-add btn-navy" id="addCatBtn">Add category</button>
  </div>

  <div class="backup-row">
    <button class="btn-cancel" id="exportBtn">⬇️ Backup data</button>
    <button class="btn-cancel" id="importBtn">⬆️ Restore backup</button>
    <input type="file" id="importFile" accept="application/json" style="display:none;">
  </div>
  <div class="backup-note">Save a backup file now and then — it protects your entries if the browser ever clears its storage.</div>
</main>

<div class="sheet-backdrop" id="catBackdrop"></div>
<div class="sheet" id="catSheet">
  <h2 id="catSheetTitle">Add category</h2>
  <div class="field">
    <label>Name</label>
    <input type="text" id="catNameField" placeholder="e.g. Fuel">
  </div>
  <div class="field">
    <label>Icon</label>
    <div class="icon-picker" id="iconPicker"></div>
  </div>
  <div class="sheet-actions">
    <button class="btn-cancel" id="catCancelBtn">Cancel</button>
    <button class="btn-save" id="catSaveBtn">Save</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<div class="sheet-backdrop" id="backdrop"></div>

<div class="sheet" id="sheet">
  <h2 id="sheetTitle">Add bill</h2>
  <div class="field">
    <label>Name</label>
    <input type="text" id="fName" placeholder="e.g. HDFC Credit Card">
  </div>
  <div class="field-row">
    <div class="field">
      <label>Amount (₹)</label>
      <input type="number" id="fAmount" inputmode="decimal" placeholder="0">
    </div>
    <div class="field">
      <label>Repeats</label>
      <select id="fRecur">
        <option value="monthly">Monthly</option>
        <option value="6months">Every 6 months</option>
        <option value="yearly">Yearly</option>
      </select>
    </div>
  </div>
  <div class="field">
    <label>Next due date</label>
    <input type="date" id="fDate">
  </div>
  <div class="field">
    <label>Note</label>
    <input type="text" id="fNotes" placeholder="Add a note">
  </div>
  <div class="field" style="display:flex;align-items:center;gap:8px;">
    <input type="checkbox" id="fPaid" style="width:auto;">
    <label style="margin:0;" for="fPaid">Paid for this cycle</label>
  </div>
  <div class="sheet-actions">
    <button class="btn-cancel" id="cancelBtn">Cancel</button>
    <button class="btn-save" id="saveBtn">Save</button>
  </div>
</div>

<div class="sheet-backdrop" id="backdrop2"></div>
<div class="sheet" id="sheet2">
  <h2 id="sheetTitle2">Add expense</h2>
  <div class="field">
    <label>Amount (₹)</label>
    <input type="number" id="eAmount" inputmode="decimal" placeholder="0">
  </div>
  <div class="field">
    <label>Note</label>
    <input type="text" id="eNote" placeholder="Add a note">
  </div>
  <div class="field" id="eTravelTypeField" style="display:none;">
    <label>Travel type</label>
    <select id="eTravelType">
      <option value="Public">Public</option>
      <option value="Private">Private</option>
    </select>
  </div>
  <div class="field">
    <label>Date</label>
    <input type="date" id="eDate">
  </div>
  <div class="sheet-actions">
    <button class="btn-cancel" id="cancelBtn2">Cancel</button>
    <button class="btn-save" id="saveBtn2">Save</button>
  </div>
</div>

<script>
const BILLS_KEY = 'bills_v1';
const EXP_KEY = 'expenses_v1';
const BUDGET_KEY = 'budgets_v1';
const CATEGORIES_DEFAULT = ['Groceries & Dairy', 'Hotels', 'Shopping', 'Travel', 'Family Expense (For parents)'];
const CATS_KEY = 'categories_v1';
const CAT_ICONS_KEY = 'categoryIcons_v1';
const TRAVEL_TYPES = ['Public', 'Private'];
const CATEGORY_ICONS_DEFAULT = {
  'Groceries & Dairy': '🛒',
  'Hotels': '🏨',
  'Shopping': '🛍️',
  'Travel': '🧳',
  'Family Expense (For parents)': '👪'
};
const ICON_CHOICES = ['🍔','🛍️','✈️','💊','📚','🎬','🏠','💡','🚗','👪','🎁','🛒','🏨','🧳','💰'];
let categoryIcons = {};
function catIcon(cat) { return categoryIcons[cat] || CATEGORY_ICONS_DEFAULT[cat] || '💰'; }
function saveCategoryIcons() { try { localStorage.setItem(CAT_ICONS_KEY, JSON.stringify(categoryIcons)); } catch (e) {} }

let bills = [];
let expenses = [];
let budgets = {};
let categories = [];
let editingId = null;
let addingCategory = null;
let confirmDeleteCat = null;
let confirmDeleteBillId = null;
let catEditingOld = null;
let selectedIcon = '💰';

function load() {
  try { bills = JSON.parse(localStorage.getItem(BILLS_KEY)) || []; } catch (e) { bills = []; }
  try { expenses = JSON.parse(localStorage.getItem(EXP_KEY)) || []; } catch (e) { expenses = []; }
  try { budgets = JSON.parse(localStorage.getItem(BUDGET_KEY)) || {}; } catch (e) { budgets = {}; }
  try { categories = JSON.parse(localStorage.getItem(CATS_KEY)) || null; } catch (e) { categories = null; }
  if (!categories || !categories.length) categories = CATEGORIES_DEFAULT.slice();
  try { categoryIcons = JSON.parse(localStorage.getItem(CAT_ICONS_KEY)) || {}; } catch (e) { categoryIcons = {}; }
}
function saveBills() { try { localStorage.setItem(BILLS_KEY, JSON.stringify(bills)); } catch (e) {} }
function saveExpenses() { try { localStorage.setItem(EXP_KEY, JSON.stringify(expenses)); } catch (e) {} }
function saveBudgets() { try { localStorage.setItem(BUDGET_KEY, JSON.stringify(budgets)); } catch (e) {} }
function saveCategories() { try { localStorage.setItem(CATS_KEY, JSON.stringify(categories)); } catch (e) {} }

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 2500);
}

function addPeriod(dateStr, recur) {
  const d = new Date(dateStr + 'T00:00:00');
  if (recur === 'monthly') d.setMonth(d.getMonth() + 1);
  else if (recur === '6months') d.setMonth(d.getMonth() + 6);
  else if (recur === 'yearly') d.setFullYear(d.getFullYear() + 1);
  return d.toISOString().slice(0, 10);
}
function daysUntil(dateStr) {
  const today = new Date(); today.setHours(0,0,0,0);
  const due = new Date(dateStr + 'T00:00:00');
  return Math.round((due - today) / 86400000);
}
function rollForward() {
  let changed = false;
  bills.forEach(b => {
    while (b.paid && daysUntil(b.dueDate) < 0) {
      b.dueDate = addPeriod(b.dueDate, b.recur);
      b.paid = false;
      changed = true;
    }
  });
  if (changed) saveBills();
}
function statusOf(b) {
  if (b.paid) return 'paid';
  const d = daysUntil(b.dueDate);
  if (d < 0) return 'overdue';
  if (d <= 2) return 'urgent';
  if (d <= 7) return 'soon';
  return 'upcoming';
}
function statusLabel(status, d) {
  if (status === 'paid') return 'Paid';
  if (status === 'overdue') return `Overdue by ${Math.abs(d)}d`;
  if (d === 0) return 'Due today';
  if (d === 1) return 'Due tomorrow';
  return `Due in ${d}d`;
}
function fmtDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
}
function fmtAmount(n) { return '₹' + Number(n).toLocaleString('en-IN'); }
function recurLabel(r) { return r === 'monthly' ? 'Monthly' : r === '6months' ? 'Every 6 months' : 'Yearly'; }
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function currentMonthLabel() {
  return new Date().toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
}
function currentMonthKey() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}

function renderBills() {
  rollForward();
  const list = document.getElementById('list');
  if (bills.length === 0) {
    list.innerHTML = '<div class="empty">No bills yet.<br>Tap + to add your first one — credit card, internet, LIC, anything recurring.</div>';
  } else {
    const sorted = [...bills].sort((a, b) => {
      const sa = statusOf(a) === 'paid' ? 1 : 0;
      const sb = statusOf(b) === 'paid' ? 1 : 0;
      if (sa !== sb) return sa - sb;
      return daysUntil(a.dueDate) - daysUntil(b.dueDate);
    });
    list.innerHTML = sorted.map(b => {
      const status = statusOf(b);
      const d = daysUntil(b.dueDate);
      return `<div class="bill status-${status}" data-id="${b.id}">
        <div class="bill-top">
          <div>
            <div class="bill-name">${escapeHtml(b.name)}</div>
            <div class="bill-recur">${recurLabel(b.recur)} · ${fmtDate(b.dueDate)}</div>
          </div>
          <div class="bill-amount">${fmtAmount(b.amount)}</div>
        </div>
        <div class="bill-status-row">
          <span class="pill">${statusLabel(status, d)}</span>
          <div class="bill-actions">
            <button class="btn-paid" data-action="pay" ${b.paid ? 'disabled' : ''}>${b.paid ? 'Paid ✓' : 'Mark paid'}</button>
            <button class="cat-icon-btn" data-action="edit">✏️</button>
            <button class="cat-icon-btn" data-action="del" style="${confirmDeleteBillId === b.id ? 'color:var(--red);font-weight:700;' : ''}">${confirmDeleteBillId === b.id ? 'Tap to confirm' : '🗑️'}</button>
          </div>
        </div>
        ${b.notes ? `<div class="bill-note-display">${escapeHtml(b.notes)}</div>` : ''}
      </div>`;
    }).join('');
  }

  let monthlySum = 0;
  bills.forEach(b => {
    const amt = Number(b.amount) || 0;
    if (b.recur === 'monthly') monthlySum += amt;
    else if (b.recur === '6months') monthlySum += amt / 6;
    else if (b.recur === 'yearly') monthlySum += amt / 12;
  });
  document.getElementById('sumMonthly').textContent = fmtAmount(Math.round(monthlySum));
}

function renderExpenses() {
  const mk = currentMonthKey();
  const monthEntries = expenses.filter(e => e.date.slice(0,7) === mk);
  const catList = document.getElementById('catList');
  let grandTotal = 0;

  catList.innerHTML = categories.map(cat => {
    const entries = monthEntries.filter(e => e.category === cat).sort((a,b) => b.date.localeCompare(a.date));
    const total = entries.reduce((s,e) => s + Number(e.amount), 0);
    grandTotal += total;
    const entriesHtml = entries.length
      ? '<div class="cat-entries">' + entries.map(e => `
          <div class="entry-row" data-id="${e.id}">
            <span>${fmtDate(e.date)}${e.travelType ? ' · ' + e.travelType : ''}${e.note ? ' · <span class="e-note">' + escapeHtml(e.note) + '</span>' : ''}</span>
            <span style="display:flex;align-items:center;gap:8px;">
              ${fmtAmount(e.amount)}
              <button class="e-del" data-action="delexp">✕</button>
            </span>
          </div>`).join('') + '</div>'
      : '';
    let breakdownHtml = '';
    if (cat === 'Travel' && entries.length) {
      const pub = entries.filter(e => e.travelType === 'Public').reduce((s,e) => s + Number(e.amount), 0);
      const priv = entries.filter(e => e.travelType === 'Private').reduce((s,e) => s + Number(e.amount), 0);
      breakdownHtml = `<div style="font-size:12px;color:var(--text-dim);margin-top:4px;">Public ${fmtAmount(pub)} · Private ${fmtAmount(priv)}</div>`;
    }
    const budget = Number(budgets[cat]) || 0;
    const isOver = budget > 0 && total > budget;
    let pillHtml = '';
    if (budget > 0) {
      pillHtml = isOver
        ? `<span class="budget-pill over">Over by ${fmtAmount(Math.round(total - budget))}</span>`
        : `<span class="budget-pill ok">${fmtAmount(Math.round(budget - total))} left</span>`;
    }
    return `<div class="cat-card ${isOver ? 'over-budget' : ''}">
      <div class="cat-top">
        <span class="cat-name">${catIcon(cat)} ${escapeHtml(cat)}</span>
        <span style="display:flex;align-items:center;gap:8px;">
          <span class="cat-total">${fmtAmount(total)}</span>
          <button class="cat-icon-btn" data-action="editcat" data-cat="${escapeHtml(cat)}">✏️</button>
          <button class="cat-icon-btn" data-action="delcat" data-cat="${escapeHtml(cat)}" style="${confirmDeleteCat === cat ? 'color:var(--red);font-weight:700;' : ''}">${confirmDeleteCat === cat ? 'Tap to confirm' : '🗑️'}</button>
        </span>
      </div>
      ${breakdownHtml}
      <div class="cat-budget-row">
        <span class="cat-budget-field">Budget
          <input type="number" inputmode="decimal" class="budget-input" data-cat="${cat}" value="${budget || ''}" placeholder="0">
        </span>
        ${pillHtml}
      </div>
      <button class="cat-add" data-cat="${cat}">+ Add expense</button>
      ${entriesHtml}
    </div>`;
  }).join('');

  document.getElementById('expMonthTotal').textContent = fmtAmount(Math.round(grandTotal));
}

function render() {
  document.getElementById('headerMonth').textContent = currentMonthLabel();
  renderBills();
  renderExpenses();
}

// Background theme toggle
const BG_THEMES = ['teal', 'slate', 'warm'];
const BG_THEME_LABELS = { teal: 'Teal Calm', slate: 'Cool Slate', warm: 'Warm Paper' };
function applyBgTheme() {
  const theme = localStorage.getItem('bgTheme') || 'teal';
  if (theme === 'teal') document.documentElement.removeAttribute('data-bg');
  else document.documentElement.setAttribute('data-bg', theme);
}
document.getElementById('bgToggle').addEventListener('click', () => {
  const current = localStorage.getItem('bgTheme') || 'teal';
  const next = BG_THEMES[(BG_THEMES.indexOf(current) + 1) % BG_THEMES.length];
  localStorage.setItem('bgTheme', next);
  applyBgTheme();
  toast(BG_THEME_LABELS[next]);
});
applyBgTheme();

// Collapsible sections
document.querySelectorAll('.section-title.collapsible').forEach(title => {
  title.addEventListener('click', () => {
    const body = document.getElementById(title.dataset.target);
    title.classList.toggle('collapsed');
    if (body) body.classList.toggle('collapsed');
  });
});

// Bill sheet
function openSheet(bill) {
  editingId = bill ? bill.id : null;
  document.getElementById('sheetTitle').textContent = bill ? 'Edit bill' : 'Add bill';
  document.getElementById('fName').value = bill ? bill.name : '';
  document.getElementById('fAmount').value = bill ? bill.amount : '';
  document.getElementById('fRecur').value = bill ? bill.recur : 'monthly';
  document.getElementById('fDate').value = bill ? bill.dueDate : new Date().toISOString().slice(0,10);
  document.getElementById('fNotes').value = bill ? (bill.notes || '') : '';
  document.getElementById('fPaid').checked = bill ? !!bill.paid : false;
  document.getElementById('backdrop').classList.add('open');
  document.getElementById('sheet').classList.add('open');
}
function closeSheet() {
  document.getElementById('backdrop').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
}
document.getElementById('addBtn').addEventListener('click', () => openSheet(null));
document.getElementById('cancelBtn').addEventListener('click', closeSheet);
document.getElementById('backdrop').addEventListener('click', closeSheet);
document.getElementById('saveBtn').addEventListener('click', () => {
  const name = document.getElementById('fName').value.trim();
  const amount = parseFloat(document.getElementById('fAmount').value) || 0;
  const recur = document.getElementById('fRecur').value;
  const dueDate = document.getElementById('fDate').value;
  const notes = document.getElementById('fNotes').value.trim();
  const paid = document.getElementById('fPaid').checked;
  if (!name || !dueDate) return;
  if (editingId) {
    const b = bills.find(x => x.id === editingId);
    if (b) { b.name = name; b.amount = amount; b.recur = recur; b.dueDate = dueDate; b.notes = notes; b.paid = paid; }
  } else {
    bills.push({ id: Date.now().toString(36), name, amount, recur, dueDate, notes, paid });
  }
  saveBills();
  closeSheet();
  render();
});
document.getElementById('list').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const card = e.target.closest('.bill');
  const id = card.dataset.id;
  const action = btn.dataset.action;
  const bill = bills.find(x => x.id === id);
  if (!bill) return;
  if (action === 'pay') { bill.paid = true; saveBills(); render(); }
  else if (action === 'del') {
    if (confirmDeleteBillId === id) {
      bills = bills.filter(x => x.id !== id);
      confirmDeleteBillId = null;
      saveBills();
      toast('Bill deleted');
      render();
    } else {
      confirmDeleteBillId = id;
      render();
      setTimeout(() => { if (confirmDeleteBillId === id) { confirmDeleteBillId = null; render(); } }, 3000);
    }
  }
  else if (action === 'edit') { openSheet(bill); }
});

// Expense sheet
function openExpenseSheet(cat) {
  addingCategory = cat;
  document.getElementById('sheetTitle2').textContent = 'Add expense · ' + cat;
  document.getElementById('eAmount').value = '';
  document.getElementById('eNote').value = '';
  document.getElementById('eDate').value = new Date().toISOString().slice(0,10);
  document.getElementById('eTravelTypeField').style.display = cat === 'Travel' ? 'block' : 'none';
  document.getElementById('eTravelType').value = 'Public';
  document.getElementById('backdrop2').classList.add('open');
  document.getElementById('sheet2').classList.add('open');
}
function closeSheet2() {
  document.getElementById('backdrop2').classList.remove('open');
  document.getElementById('sheet2').classList.remove('open');
}
document.getElementById('cancelBtn2').addEventListener('click', closeSheet2);
document.getElementById('backdrop2').addEventListener('click', closeSheet2);
document.getElementById('saveBtn2').addEventListener('click', () => {
  const amount = parseFloat(document.getElementById('eAmount').value) || 0;
  const note = document.getElementById('eNote').value.trim();
  const date = document.getElementById('eDate').value;
  if (!amount || !date || !addingCategory) return;
  const entry = { id: Date.now().toString(36), category: addingCategory, amount, note, date };
  if (addingCategory === 'Travel') entry.travelType = document.getElementById('eTravelType').value;
  expenses.push(entry);
  saveExpenses();
  closeSheet2();
  render();
});
document.getElementById('catList').addEventListener('click', (e) => {
  const addBtn = e.target.closest('.cat-add');
  if (addBtn) { openExpenseSheet(addBtn.dataset.cat); return; }
  const delExpBtn = e.target.closest('[data-action="delexp"]');
  if (delExpBtn) {
    const row = e.target.closest('.entry-row');
    const id = row.dataset.id;
    expenses = expenses.filter(x => x.id !== id);
    saveExpenses();
    render();
    return;
  }
  const editCatBtn = e.target.closest('[data-action="editcat"]');
  if (editCatBtn) { openCatSheet(editCatBtn.dataset.cat); return; }
  const delCatBtn = e.target.closest('[data-action="delcat"]');
  if (delCatBtn) {
    const cat = delCatBtn.dataset.cat;
    if (confirmDeleteCat === cat) {
      categories = categories.filter(c => c !== cat);
      expenses = expenses.filter(e => e.category !== cat);
      delete budgets[cat];
      delete categoryIcons[cat];
      confirmDeleteCat = null;
      saveCategories(); saveExpenses(); saveBudgets(); saveCategoryIcons();
      toast('Category deleted');
      render();
    } else {
      confirmDeleteCat = cat;
      render();
      setTimeout(() => { if (confirmDeleteCat === cat) { confirmDeleteCat = null; render(); } }, 3000);
    }
    return;
  }
});
document.getElementById('addCatBtn').addEventListener('click', () => openCatSheet(null));

function openCatSheet(existingCat) {
  catEditingOld = existingCat || null;
  document.getElementById('catSheetTitle').textContent = existingCat ? 'Edit category' : 'Add category';
  document.getElementById('catNameField').value = existingCat || '';
  selectedIcon = existingCat ? catIcon(existingCat) : '💰';
  renderIconPicker();
  document.getElementById('catBackdrop').classList.add('open');
  document.getElementById('catSheet').classList.add('open');
}
function closeCatSheet() {
  document.getElementById('catBackdrop').classList.remove('open');
  document.getElementById('catSheet').classList.remove('open');
}
function renderIconPicker() {
  document.getElementById('iconPicker').innerHTML = ICON_CHOICES.map(ic =>
    `<button type="button" class="icon-btn ${ic === selectedIcon ? 'selected' : ''}" data-icon="${ic}">${ic}</button>`
  ).join('');
}
document.getElementById('iconPicker').addEventListener('click', (e) => {
  const btn = e.target.closest('.icon-btn');
  if (!btn) return;
  selectedIcon = btn.dataset.icon;
  renderIconPicker();
});
document.getElementById('catCancelBtn').addEventListener('click', closeCatSheet);
document.getElementById('catBackdrop').addEventListener('click', closeCatSheet);
document.getElementById('catSaveBtn').addEventListener('click', () => {
  const name = document.getElementById('catNameField').value.trim();
  if (!name) return;
  if (catEditingOld) {
    if (name !== catEditingOld && categories.includes(name)) { toast('That category already exists.'); return; }
    if (name !== catEditingOld) {
      categories = categories.map(c => c === catEditingOld ? name : c);
      expenses.forEach(e => { if (e.category === catEditingOld) e.category = name; });
      if (budgets[catEditingOld] !== undefined) { budgets[name] = budgets[catEditingOld]; delete budgets[catEditingOld]; }
      delete categoryIcons[catEditingOld];
    }
    categoryIcons[name] = selectedIcon;
  } else {
    if (categories.includes(name)) { toast('That category already exists.'); return; }
    categories.push(name);
    categoryIcons[name] = selectedIcon;
  }
  saveCategories(); saveExpenses(); saveBudgets(); saveCategoryIcons();
  closeCatSheet();
  render();
});
document.getElementById('catList').addEventListener('change', (e) => {
  const input = e.target.closest('.budget-input');
  if (!input) return;
  const cat = input.dataset.cat;
  const val = parseFloat(input.value) || 0;
  budgets[cat] = val;
  saveBudgets();
  render();
});
document.getElementById('catList').addEventListener('click', (e) => {
  if (e.target.closest('.budget-input')) e.stopPropagation();
});

load();
render();

document.getElementById('exportBtn').addEventListener('click', async () => {
  const data = { bills, expenses, budgets, categories, categoryIcons, exportedAt: new Date().toISOString() };
  const json = JSON.stringify(data, null, 2);
  const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const now = new Date();
  const filename = monthNames[now.getMonth()] + '-' + now.getFullYear() + '-Expenses.json';
  if (window.claude && typeof window.claude.use === 'function') {
    try {
      const downloads = await window.claude.use('downloads');
      if (downloads) {
        try {
          await downloads.save({ filename, data: json });
          return;
        } catch (err) {
          if (err && err.code === 'declined') return;
        }
      }
    } catch (e) {}
  }
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});
document.getElementById('importBtn').addEventListener('click', () => {
  document.getElementById('importFile').click();
});
document.getElementById('importFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (data.bills) bills = data.bills;
      if (data.expenses) expenses = data.expenses;
      if (data.budgets) budgets = data.budgets;
      if (data.categories) categories = data.categories;
      if (data.categoryIcons) categoryIcons = data.categoryIcons;
      saveBills(); saveExpenses(); saveBudgets(); saveCategories(); saveCategoryIcons();
      render();
      toast('Backup restored');
    } catch (err) {
      toast('Could not read that file — make sure it is a backup from this app.');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});
</script>
